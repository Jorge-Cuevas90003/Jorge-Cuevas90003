name: Update Dynamic Profile SVGs

on:
  schedule:
    - cron: '0 6 * * *'   # cada dia a las 6am UTC
  push:
    branches: [main]
  workflow_dispatch:       # boton manual en GitHub

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Generate SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: Jorge-Cuevas90003
        run: python .github/scripts/generate.py

      - name: Commit updated SVGs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stack.svg projects.svg stats.svg last_commit.svg
          git diff --staged --quiet || git commit -m "chore: auto-update dynamic SVGs [skip ci]"
          git push
