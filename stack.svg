<svg width="900" height="100" viewBox="0 0 900 100" xmlns="http://www.w3.org/2000/svg" font-family="'Arial Black', Arial, sans-serif">
  <rect width="900" height="100" fill="#111111"/>
  <rect x="0" y="0" width="900" height="4" fill="#F5E642"/>
  <text x="30" y="32" font-size="9" font-weight="700" fill="#F5E642" letter-spacing="8">TECH STACK // LANGUAGES &amp; TOOLS</text>
  <rect x="30" y="38" width="840" height="1" fill="#F5E642" opacity="0.3"/>

  <!-- Row 1: Languages (filled = primary, outline = used) -->
  <!-- Python - primary -->
  <rect x="30" y="52" width="80" height="28" fill="#F5E642"/>
  <text x="70" y="71" font-size="11" font-weight="900" fill="#111111" text-anchor="middle" letter-spacing="1">PYTHON</text>

  <!-- JavaScript -->
  <rect x="122" y="52" width="80" height="28" fill="none" stroke="#F5E642" stroke-width="1.5"/>
  <text x="162" y="71" font-size="11" font-weight="900" fill="#F5E642" text-anchor="middle" letter-spacing="1">JS / TS</text>

  <!-- HTML/CSS -->
  <rect x="214" y="52" width="90" height="28" fill="none" stroke="#F5E642" stroke-width="1.5"/>
  <text x="259" y="71" font-size="11" font-weight="900" fill="#F5E642" text-anchor="middle" letter-spacing="1">HTML/CSS</text>

  <!-- Java -->
  <rect x="316" y="52" width="72" height="28" fill="none" stroke="#F5E642" stroke-width="1.5"/>
  <text x="352" y="71" font-size="11" font-weight="900" fill="#F5E642" text-anchor="middle" letter-spacing="1">JAVA</text>

  <!-- C# -->
  <rect x="400" y="52" width="60" height="28" fill="none" stroke="#F5E642" stroke-width="1.5"/>
  <text x="430" y="71" font-size="11" font-weight="900" fill="#F5E642" text-anchor="middle" letter-spacing="1">C#</text>

  <!-- Tools divider -->
  <rect x="474" y="52" width="2" height="28" fill="#333333"/>

  <!-- Google ADK -->
  <rect x="488" y="52" width="100" height="28" fill="none" stroke="#555555" stroke-width="1.5"/>
  <text x="538" y="71" font-size="10" font-weight="700" fill="#555555" text-anchor="middle" letter-spacing="1">GOOGLE ADK</text>

  <!-- FastAPI -->
  <rect x="600" y="52" width="80" height="28" fill="none" stroke="#555555" stroke-width="1.5"/>
  <text x="640" y="71" font-size="10" font-weight="700" fill="#555555" text-anchor="middle" letter-spacing="1">FASTAPI</text>

  <!-- Git -->
  <rect x="692" y="52" width="60" height="28" fill="none" stroke="#555555" stroke-width="1.5"/>
  <text x="722" y="71" font-size="10" font-weight="700" fill="#555555" text-anchor="middle" letter-spacing="1">GIT</text>
</svg>
